# Deploy RAVEN AI landing page → GitHub Pages (manual fallback on RAVEN-AI-UI)
# No Actions artifacts — avoids storage quota limits

name: Deploy Landing Page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exclusive author (rabbittrix only)
        if: github.actor != 'rabbittrix'
        run: |
          echo "::error::Only Roberto de Souza (GitHub: rabbittrix) may deploy the production landing page."
          exit 1

  build:
    needs: authorize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site (validate)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Verify Roberto de Souza push token
        env:
          RAVEN_SYNC_TOKEN: ${{ secrets.RAVEN_SYNC_TOKEN }}
        run: bash .github/scripts/verify-raven-sync-token.sh

      - name: Build static site for deploy
        working-directory: landing-page
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.RAVEN_SYNC_TOKEN }}
          publish_dir: landing-page/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: Roberto de Souza
          user_email: rabbittrix@hotmail.com
          commit_message: "deploy: landing page ${{ github.sha }}"

      - name: Configure GitHub Pages source (gh-pages / root)
        env:
          GH_TOKEN: ${{ secrets.RAVEN_SYNC_TOKEN }}
        run: |
          set -e
          configure() {
            gh api "repos/${{ github.repository }}/pages" \
              -X PUT \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          }
          configure || gh api "repos/${{ github.repository }}/pages" \
            -X POST \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
          echo "GitHub Pages configured: gh-pages @ /"
