# Deploy landing page to GitHub Pages on the current repo (GITHUB_TOKEN).
# On RAVEN-AI, push deploys are handled by sync-landing-ui.yml.

name: Deploy Landing Page

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to stage (e.g. v1.0.1)"
        required: false
        type: string
  repository_dispatch:
    types: [deploy-landing]

permissions:
  contents: write

concurrency:
  group: raven-ui-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || github.repository == 'rabbittrix/RAVEN-AI-UI'
    uses: ./.github/workflows/deploy-to-ui.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      release_tag: ${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || '' }}
