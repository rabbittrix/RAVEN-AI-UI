# Deploy RAVEN AI landing page → GitHub Pages (RAVEN-AI-UI repo)
# Uses direct gh-pages push (no Actions artifact storage — avoids quota limits)
# Author: Roberto de Souza — exclusive push rights for production

name: Deploy Landing Page

on:
  push:
    branches: [main, master]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy-landing.yml"
  release:
    types: [published]
  repository_dispatch:
    types: [raven-release-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Verify exclusive author (rabbittrix only)
        if: github.actor != 'rabbittrix'
        run: |
          echo "::error::Only Roberto de Souza (GitHub: rabbittrix) may deploy the production landing page."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Push dist/ to gh-pages — no upload-artifact / storage quota required
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.RAVEN_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          publish_dir: landing-page/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: landing page ${{ github.sha }}"

      - name: Configure GitHub Pages source (gh-pages / root)
        env:
          GH_TOKEN: ${{ secrets.RAVEN_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          configure() {
            gh api "repos/${{ github.repository }}/pages" \
              -X PUT \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          }
          configure || gh api "repos/${{ github.repository }}/pages" \
            -X POST \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
          echo "GitHub Pages configured: gh-pages @ /"
